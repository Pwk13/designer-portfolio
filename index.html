,{name:"AIGC 视觉",en:"AIGC VISUAL",desc:"漫剧 · 动态 · 内容美术",image:"./assets/works/work-aurora.webp"}]},skills:[{name:"AIGC 美术",value:"99%"},{name:"品牌视觉",value:"99%"},{name:"海报版式",value:"99%"},{name:"插画图形",value:"99%"},{name:"动态视觉",value:"99%"},{name:"UI/UX",value:"99%"}],tools:["Photoshop","Illustrator","Premiere Pro","Figma","ComfyUI","Kling","Vidu","即梦"],works:[{id:"coffeecreative",title:"咖啡创想日",category:"海报",year:"2025",desc:"一杯咖啡，点燃无限创意灵感",note:"海报采用美式复古波普漫画风格，将咖啡杯拟人化塑造活力 IP 形象。高饱和撞色搭配手绘肌理，营造年轻潮流氛围。画面融合艺术、音乐、市集等活动信息，清晰传递活动价值。版式活泼且层级分明，兼顾视觉吸引力与信息传达效率，精准吸引创意人群，实现活动商业宣传目的。",image:"./assets/works/work-coffeecreative.webp",aspect:"4 / 5"},{id:"app-xinggui",title:"「星轨日记」情绪记录 App",category:"UI",year:"2025",desc:"情绪宇宙概念：让记录成为习惯、让情绪有归宿。",note:"「星轨日记」是一款结合情绪记录、日记、习惯养成与星空探索的治愈系应用。设计以「情绪宇宙」为核心概念：用户记录每日心情后，系统将其转化为一颗星球的成长轨迹，随着记录累积星球不断成长、解锁新的星域，让坚持变得可视、可感、可期待。视觉上以黑、橙、白为主色，配合星球、轨道与星尘图形，营造安静而有希望的宇宙氛围；心情选择、日历视图、日记列表与数据统计均采用圆润卡片与柔和过渡，弱化工具感，强化陪伴感。功能上整合情绪星球、习惯养成、行星音乐与隐私安全等模块，在觉察、表达、复盘之间建立完整链路。",image:"./assets/works/work-app-xinggui.webp",aspect:"4 / 5"},{id:"coffeeanywhere",title:"",category:"海报",year:"一杯随行，随时随地邂逅醇香咖啡",desc:"",note:"海报采用美式复古涂鸦漫画风格，将便携咖啡杯拟人化打造潮酷 IP 形象。高饱和蓝黄撞色搭配手撕纸肌理，视觉张力强烈。画面植入保冷保温、防漏便携等产品卖点，结合城市出行场景，面向都市年轻群体。版式层次清晰，平衡艺术表达与商业信息传递，强化产品潮流属性，提升品牌传播力。",image:"./assets/works/work-coffeeanywhere.webp",aspect:"4 / 5"},{id:"vi-linkora",title:"Linkora 连接灵感品牌 VI 手册",category:"品牌",year:"2025",desc:"PLAY · CONNECT · INSPIRE：理性与活力的平衡。",note:"Linkora 是一个以「连接·启发·创造」为理念的品牌，主张通过连接激发灵感。VI 手册以深海军蓝为主色、荧光绿为强调色，辅以亮蓝与淡紫，构建理性而富有活力的视觉系统。标志图形由符号与字母组成，象征连接、互动与灵感的汇聚；字体规范采用思源黑体系列，保证中文环境下的清晰传达。基础系统规范了标志组合与安全空间、色彩、字体、辅助图形与图标系统，应用系统覆盖名片、信封信纸、PPT 模板、包装、服饰徽章、数字应用、社交媒体与宣传物料，贯穿品牌与受众沟通的每一个触点。辅助图形以抽象的曲线、几何色块与点状元素灵活应用于各类物料，强化视觉个性。",image:"./assets/works/work-vi-linkora.webp",aspect:"4 / 5"},{id:"reading",title:"「阅读让世界更大」",category:"插画",year:"2025",desc:"蓝鲸驮城堡遨游云海的奇幻阅读场景。",note:"以「一本书·一场新的远方」为叙事核心，描绘蓝鲸驮着城堡遨游云海的奇幻场景，红帽女孩坐在书堆上阅读，罗盘、地图与飞鸟隐喻探索与想象。青绿色调梦幻清新，将阅读的辽阔感视觉化。",image:"./assets/works/work-reading.webp",aspect:"4 / 5"},{id:"goodtrip",title:"GOOD TRIP 旅行",category:"插画",year:"2025",desc:"波普涂鸦风格的自由旅行态度。",note:"波普涂鸦风格记录「说走就走」的旅行态度。旅行者戴耳机墨镜、手持相机，哈士奇与房车、雪山构成假日图景；路标「CITY/MOUNTAIN/SEA/FREEDOM」与勾选清单强化自由探索的情绪。",image:"./assets/works/work-goodtrip.webp",aspect:"4 / 5"},{id:"vi-galaxio",title:"GALAXIO 太空探索品牌 VI",category:"品牌",year:"2025",desc:"探索·连接·守护：深空蓝科技品牌全案视觉。",note:"GALAXIO 是一个以太空探索为定位的科技探索品牌，主张「探索·连接·守护」。整套 VI 以深空蓝为主色、活力红为强调色，配合白色构建宇宙级视觉秩序：标志以简洁的火箭与星球图形组合传达探索基因，字标选用 SPACE GROTESK 与思源黑体保证科技感与中文可读性；品牌吉祥物为不同姿态的卡通宇航员，贯穿应用示例、海报与界面，建立强识别符号。手册完整覆盖标志规范、色值、字体、图形元素、图标系统、移动端与网页端界面、品牌场景应用与延展图案，形成从基础系统到应用系统的闭环；海报以「探索、连接、守护」三主题延展叙事，周边产品与界面统一视觉语言。",image:"./assets/works/work-vi-galaxio.webp",aspect:"4 / 5"},{id:"app-xinglv",title:"「星旅计划」旅行规划助手 App",category:"UI",year:"2025",desc:"智能行程规划 + 预算管理的旅行助手。",note:"「星旅计划」是一款集智能行程规划、预算管理、灵感发现与旅途记录于一体的旅行助手应用。设计以深蓝与暖黄为主色，象征星空探索与温暖旅程，配合星球、星空与旅行人物插画，构建充满探索欲的产品气质。从引导页的「探索世界」叙事，到核心的行程规划、预算管理与旅途记录页面，完整覆盖用户出行前中后全流程；行程卡片、预算分布图与记录时间轴均以清晰的层级和统一的图形语言呈现，降低操作成本。灵感发现页以目的地故事激发出行冲动，分享体系鼓励记录与传播，形成体验闭环。",image:"./assets/works/work-app-xinglv.webp",aspect:"4 / 5"},{id:"creativelife",title:"CREATIVE LIFE 街头",category:"插画",year:"2025",desc:"高饱和撞色记录创意生活的灵感瞬间。",note:"高饱和撞色与张扬笔触描绘创意青年的日常：红帽少年与黑猫被书籍、相机与灵感便签环绕，「GOOD IDEAS MAKE BETTER DAYS」等标语强化积极追梦的街头文化气质。",image:"./assets/works/work-creativelife.webp",aspect:"4 / 5"},{id:"w-1789478309152",image:"./assets/works/work-daily-energy.webp",title:"每日能量",category:"海报",year:"2026",desc:"一杯咖啡，唤醒每日能量，开启全新状态",note:"海报采用现代拼贴解构风格，以黑橙配色构建沉稳高级的视觉基调。流动咖啡液与咖啡豆作为核心视觉符号，直观传递产品特质。版式运用非对称几何分割，将产品卖点与情绪文案有序排布。画面兼顾美学质感与商业信息传递，面向都市上班族，塑造精致、有质感的咖啡品牌形象。"},{id:"app-chongji",title:"「宠迹」宠物健康管理 App 全案",category:"UI",year:"2025",desc:"宠物健康管家：柯基 IP 与暖橙系完整产品体验。",note:"「宠迹」是一款专为宠物家长打造的全方位健康管理应用。设计以「懂它的每一天，陪它的一辈子」为核心主张，从情感陪伴出发构建整套产品视觉。品牌 IP 采用亲和力十足的柯基形象，贯穿引导页、功能页与社区互动，降低产品的使用门槛，也让每一次打开都更有温度。界面以暖橙为主色、米白与深灰为辅，营造温暖、可信赖的视觉氛围；健康记录、智能提醒、饮食建议、成长档案与社区交流五大模块分层清晰，图标与插画统一圆润语言，确保功能识别与情感表达并重。在信息架构上，用卡片化布局与留白控制信息密度，让健康数据一目了然；同时规范了色彩、字体（思源黑体/DIN Alternate）与组件体系，保证多端体验的一致性。",image:"./assets/works/work-app-chongji.webp",aspect:"4 / 5"},{id:"petapp",title:"「汪星守护」宠物健康 App 全案",category:"UI",year:"2025",desc:"宠物健康管理 App：柯基 IP 与暖橙系产品体验。",note:"面向宠物家庭的健康管理产品。以柯基 IP 拉近情感距离，暖橙色系传递温暖关怀；完整设计了启动页、图标、组件规范与核心功能页，从记录、提醒到社区互动，构建可落地的全链路产品体验。",image:"./assets/works/work-petapp.webp",aspect:"4 / 5"},{id:"vi-novapulse",title:"NOVA PULSE 科技品牌 VI 手册",category:"品牌",year:"2025",desc:"宇航员 IP PULSY：未来科技的想象与温度。",note:"NOVA PULSE 是一个探索未来的创新科技品牌，致力于用智能、连接与体验让世界更有趣、更高效、更美好。品牌核心视觉为卡通宇航员 IP「PULSY」，以灵动造型与亲和性格陪伴用户探索无限可能。VI 手册以深空蓝为底，电光青、脉冲粉、星耀黄等辅助色构建未来感色彩系统；标志、标准字（INTER/DIN NEXT）、图形与图标系统统一规范，确保品牌在科技语境下的识别效率。应用系统覆盖 APP 界面、海报、办公用品、环境导视与周边产品等多元场景，从启动页「HELLO, FUTURE」到海报「EXPLORE THE FUTURE」，品牌口号「LET'S PULSE」贯穿始终，强化品牌记忆点。",image:"./assets/works/work-vi-novapulse.webp",aspect:"4 / 5"},{id:"skatechill",title:"SKATE & CHILL 滑板",category:"插画",year:"2025",desc:"小狗滑手与夕阳滑板场的轻松潮流插画。",note:"潮流滑板主题涂鸦：拟人小狗戴棒球帽与耳机，在夕阳滑板场举着冰饮「chill」一下；黄粉青黑高饱和配色与「LIFE IS BETTER ON A BOARD」标语，传递轻松随性的街头生活方式。",image:"./assets/works/work-skatechill.webp",aspect:"4 / 5"},{id:"reading2",title:"「在书里遇见更大的世界」",category:"插画",year:"2025",desc:"贝雷帽女孩与云海城堡的阅读想象。",note:"贝雷帽女孩坐在摊开的巨书上，猫咪相伴，背景是云海中的城堡与游鲸；台灯、书堆与绿植营造阅读的仪式感，表达「阅读让想象不设限」，画面清新治愈、富有故事性。",image:"./assets/works/work-reading2.webp",aspect:"4 / 5"},{id:"aurora",title:"AURORA HARVEST 品牌 VI",category:"品牌",year:"2025",desc:"可持续农业品牌的全套视觉识别。",note:"为可持续有机农业品牌建立完整视觉识别：融合花卉、叶片与太阳的品牌标志传达自然生机，浅米色系与衬线字体现高端有机质感，从包装、摄影、网站到门店环境形成统一规范。",image:"./assets/works/work-aurora.webp",aspect:"4 / 5"},{id:"inkrhyme",title:"「墨韵新聲」",category:"海报",year:"2024",desc:"新中式水墨展视觉：墨色凤凰与金箔交融。",note:"为当代水墨艺术展设计的视觉主视觉。墨色凤凰与金箔元素交融，象征传统笔墨在现代语境中的新生；「墨韵新聲」与英文副标对仗排布，展出信息清晰分层，兼顾文化底蕴与展览传播功能。",image:"./assets/works/work-inkrhyme.webp",aspect:"4 / 5"},{id:"vi-orbix",title:"ORBIX 活泼科技品牌 VI 手册",category:"品牌",year:"2025",desc:"圆润球状视觉语言 + 明快撞色的年轻品牌。",note:"ORBIX 是一个以圆润球状视觉元素为核心的活泼科技品牌。整套视觉识别系统手册采用蓝、红、黄、青的明快配色，配合圆润的几何造型，传递年轻、灵动、友好的品牌气质。基础系统涵盖品牌标志及反白稿、标准色彩、字体规范（ORBITRON/思源黑体）、图形元素与辅助图形，建立清晰的视觉语言；应用系统完整展示名片、信封与信纸、手机界面、 t:"4 / 5"},{id:"gua-dragon",title:"「龙韵少年」",category:"插画",year:"2025",desc:"红青撞色 × 少年与龙：传统美学的年轻表达。",note:"「龙韵少年」是一幅融合传统国风与当代潮流的插画作品。画面以红青撞色的斜纹背景与明黄边框奠定强烈的视觉张力，少年身着融合传统纹样与现代服饰的穿搭，倚靠木质台面、手持茶杯，神情悠然，传递「新旧交融」的生活态度；身后盘踞的青绿巨龙以红金点缀，威严而不失灵动，与少年的松弛形成有趣对比。细节上，茶壶、折扇、书卷、山水画卷、灯笼与海浪纹样共同构建东方意境，而复古背包与潮流单品则注入现代气息，背景的云海古建与仙鹤进一步拓展画面的叙事纵深。",image:"./assets/works/work-gua-dragon.webp",aspect:"4 / 5"},{id:"gua-luck",title:"「好运少女」",category:"插画",year:"2025",desc:"红蓝撞色 × 福运主题：传统祝福的潮流演绎。",note:"「好运少女」以红、蓝、米黄为主色调，描绘一位身着红纹古风外袍、搭配休闲白裤与潮流运动鞋的少女，手托脸颊、姿态闲适，身旁黑白猫咪佩戴福字项圈，画面充满「被好运包围」的松弛感。身后青蓝带金纹的巨龙、红日、祥云与盛开的红牡丹构成东方吉祥意象，红灯笼与「福」字点缀强化节庆氛围；同时画面融入书籍、笔记本电脑、咖啡杯、纸笔等现代物件，以及「新的每一天」「好运常在」「计划·行动·成长」「更好的自己·从现在开始」等励志文案，将传统祝福与现代生活态度并置。",image:"./assets/works/work-gua-luck.webp",aspect:"4 / 5"},{id:"w-1789572435862",image:"./assets/works/work-energy-go.webp",title:"能量随行",category:"海报",year:"2026",desc:"能量满格，随行而动，为每一段旅途持续续航",note:"采用复古美式漫画风格，将充电宝拟人化塑造鲜活 IP 形象，以高饱和撞色强化视觉冲击力。画面提炼快充、大容量等核心商业卖点，结合户外场景，精准触达年轻消费群体。版式层次分明，兼顾艺术表现力与信息传递效率，以潮流视觉降低产品宣传距离感，实现商业传播价值。"},{id:"w-1789572522158",image:"./assets/works/work-mountain-go.webp",title:"山野随行・运动水",category:"海报",year:"2026",desc:"随行补水，奔赴每一场山野探索",note:"海报采用美式复古漫画视觉语言，将产品拟人化为户外探险 IP 形象。高饱和撞色搭配版画肌理，营造潮流活力质感。画面整合防漏、耐用等核心产品卖点，结合山野场景，精准面向户外年轻消费群体。版式主次有序，平衡艺术表现力与商业信息传达，强化产品潮流属性，提升品牌吸引力。"},{id:"unseen",title:"EXPLORE THE UNSEEN",category:"海报",year:"2024",desc:"复古科幻风的影视招募海报。",note:"复古科幻风影视招募海报：礼帽男子行走于漩涡光带，飞碟与星座符号点缀，米白、深红、黑配色叠加做旧质感；「探索感知的边界」的主题文案与 Casting Call 信息醒目，神秘而有张力。",image:"./assets/works/work-unseen.webp",aspect:"4 / 5"},{id:"nioma",title:"「别看了，你才是牛马」",category:"海报",year:"2024",desc:"牛马戴眼镜的职场吐槽与假期宣言。",note:"以牛马戴眼镜的荒诞形象调侃职场生态，蓝绿色手绘与办公元素交织，镜片折射加班日常；「暂停常规，开启奇想模式」的假期主张配合 05.01-05.05 活动信息，幽默中带传播力。",image:"./assets/works/work-nioma.webp",aspect:"4 / 5"},{id:"poster-cf-vintage",title:"「Good Coffee Better Days」",category:"海报",year:"2025",desc:"日式复古潮流：一杯咖啡与美好生活。",note:"「Good Coffee Better Days」是一张复古潮流风格的咖啡主题海报。画面以橙、红、青为主色，暖黄色底配合放射状线条与日式富士山、红日元素，营造浓郁的上世纪复古海报质感。主体人物戴墨镜、红帽、身着红色外套，坐在咖啡木箱上悠闲举杯，身旁戴红镜片眼镜的猫咪与堆满的咖啡豆强化场景的生活气息；后方巨型咖啡杯印有主题标语并升起袅袅热气，成为画面的视觉锚点。左侧咖啡品类列表与右侧「现磨咖啡」等文字信息以复古印刷排布，兼顾商业信息与装饰美感。",image:"./assets/works/work-poster-cf-vintage.webp",aspect:"4 / 5"},{id:"poster-cf-street",title:"「街头咖啡」",category:"海报",year:"2025",desc:"街头艺术 × 咖啡文化：松弛有态度的画面。",note:"这是一幅街头潮流风格的咖啡主题插画海报。画面以暖黄为底，橙红与青蓝撞色构成强烈视觉冲击，卷发少年身着橙红棉服、补丁牛仔裤与潮牌运动鞋席地而坐，身旁咖啡杯、麻袋与散落的咖啡豆、咖啡花、咖啡果构建完整的咖啡语境；身后巨型拟人化咖啡杯被一只大手托举，大眼睛与冒热气的杯口赋予角色生命力，与少年形成轻松有趣的互动。背景的咖啡门店街景、红白条纹遮阳篷、落日与放射状线条共同营造街头文化的氛围，粗犷的线条与复古印刷质感让画面充满手作的温度。",image:"./assets/works/work-poster-cf-street.webp",aspect:"4 / 5"},{id:"poster-cf-yuanqi",title:"「元气咖啡」",category:"海报",year:"2025",desc:"一杯好咖啡，开启元气一天。",note:"「一杯好咖啡，开启元气一天」是一张国潮风格的咖啡主题商业插画海报。主角为拟人化咖啡杯卡通形象，头戴棒球帽、墨镜，脚踩滑板，表情活泼张扬，以动感姿态强化「元气」主题；两侧的白色猫咪与戴绿帽小熊卡通形象丰富画面趣味，背景融合城市建筑与咖啡豆、咖啡树、咖啡花等元素，外卖小哥骑电动车配送的画面直观传达「快速配送」的产品卖点。配色以明快的撞色为主，线条圆润、造型讨喜，信息分区清晰：主标题、好心情标语与香醇浓郁、现磨新鲜、快速配送等卖点标签层次分明，底部「现在就来喝一杯」形成行动号召。",image:"./assets/works/work-poster-cf-yuanqi.webp",aspect:"4 / 5"},{id:"poster-cf-planet",title:"「咖啡星球」",category:"海报",year:"2025",desc:"这杯咖啡，为你而来：科幻叙事注入仪式感。",note:"「这杯咖啡，为你而来」是一张复古科幻风格的咖啡商业宣传海报。画面以黑、米白与棕褐为主色，营造老式科幻电影般的怀旧氛围：巨型咖啡杯居于视觉中心，咖啡液如星云般环绕杯身，宇航员、星球与火箭等太空元素点缀其间，暗示咖啡带来的探索与能量；下方咖啡门店与咖啡师形象建立真实的消费场景。海报以左右分栏结构系统传达卖点——精选全球优质咖啡豆、匠心烘焙、新鲜研磨、多种风味，以及随时随地享受咖啡时刻、精品包装、会员专享、安心品质等服务承诺，信息层级清晰、阅读节奏舒适；底部「下单即享专属咖啡时光」与每日打卡计划强化转化引导。",image:"./assets/works/work-poster-cf-planet.webp",aspect:"4 / 5"}]},Yf="portfolio-edit-db",kt="kv",Fr="portfolio-edit-v1";let Nr=null;function Wi(){return Nr||(Nr=new Promise((e,t)=>{try{const n=indexedDB.open(Yf,1);n.onupgradeneeded=()=>{n.result.objectStoreNames.contains(kt)||n.result.createObjectStore(kt)},n.onsuccess=()=>e(n.result),n.onerror=()=>t(n.error)}catch(n){t(n)}}),Nr)}async function pc(e){try{const t=await Wi();return await new Promise((r,l)=>{const i=t.transaction(kt,"readonly").objectStore(kt).get(e);i.onsuccess=()=>r(i.result),i.onerror=()=>l(i.error)})}catch{try{const t=localStorage.getItem(e);return t?JSON.parse(t):void 0}catch{return}}}async function mc(e,t){try{const
